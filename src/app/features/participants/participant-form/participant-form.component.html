
    <div class="page">
      <div class="page-header">
        <button mat-icon-button [routerLink]="['/events', eventId, 'participants']"><mat-icon>arrow_back</mat-icon></button>
        <div>
          <h1>{{ isEdit ? 'Editar Participante' : 'Nuevo Participante' }}</h1>
          <p>Evento #{{ eventId }}</p>
        </div>
      </div>
      <mat-card>
        <mat-card-content>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-grid">
              <mat-form-field appearance="outline">
                <mat-label>Nombre completo *</mat-label>
                <input matInput formControlName="name">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Cédula / Documento *</mat-label>
                <input matInput formControlName="documentId">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Correo electrónico</mat-label>
                <input matInput formControlName="email" type="email">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Teléfono</mat-label>
                <input matInput formControlName="phone">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Empresa</mat-label>
                <input matInput formControlName="company">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Cargo</mat-label>
                <input matInput formControlName="position">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Calificación (0-100)</mat-label>
                <input matInput formControlName="score" type="number" min="0" max="100">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Estado de certificación</mat-label>
                <mat-select formControlName="certificationStatus">
                  <mat-option value="pending">Pendiente</mat-option>
                  <mat-option value="approved">Aprobado</mat-option>
                  <mat-option value="failed">Reprobado</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="form-actions">
              <button mat-button type="button" [routerLink]="['/events', eventId, 'participants']">Cancelar</button>
              <button mat-raised-button color="primary" type="submit" [disabled]="loading()">
                @if (loading()) { <mat-spinner diameter="18" /> } @else { Guardar }
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>

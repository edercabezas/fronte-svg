
    <div class="page">
      <div class="page-header">
        <button mat-icon-button routerLink="/users"><mat-icon>arrow_back</mat-icon></button>
        <div>
          <h1>{{ isEdit ? 'Editar Usuario' : 'Nuevo Usuario' }}</h1>
        </div>
      </div>
      <mat-card style="max-width:520px">
        <mat-card-content>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-col">
              <mat-form-field appearance="outline"><mat-label>Nombre completo *</mat-label><input matInput formControlName="name"></mat-form-field>
              <mat-form-field appearance="outline"><mat-label>Correo electrónico *</mat-label><input matInput formControlName="email" type="email"></mat-form-field>
              @if (!isEdit) {
                <mat-form-field appearance="outline"><mat-label>Contraseña *</mat-label><input matInput formControlName="password" type="password"></mat-form-field>
              }
              <mat-form-field appearance="outline">
                <mat-label>Rol</mat-label>
                <mat-select formControlName="role">
                  <mat-option value="capacitador">Capacitador</mat-option>
                  <mat-option value="cargador">Cargador de Eventos</mat-option>
                  <mat-option value="administrativo">Administrativo</mat-option>
                  <mat-option value="administrador">Administrador</mat-option>
                </mat-select>
              </mat-form-field>
              <div class="form-actions">
                <button mat-button type="button" routerLink="/users">Cancelar</button>
                <button mat-raised-button color="primary" type="submit" [disabled]="loading()">
                  @if (loading()) { <mat-spinner diameter="18" /> } @else { Guardar }
                </button>
              </div>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>


    <aside class="sidebar" [class.collapsed]="collapsed()">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <mat-icon>verified</mat-icon>
        </div>
        @if (!collapsed()) {
          <div class="brand-text">
            <span class="brand-name">CertPlatform</span>
            <span class="brand-sub">Gestión de Certificaciones</span>
          </div>
        }
      </div>

      <nav class="sidebar-nav">
        @for (item of visibleItems; track item.route) {
          <a [routerLink]="item.route"
             routerLinkActive="active"
             class="nav-item"
             [matTooltip]="collapsed() ? item.label : ''"
             matTooltipPosition="right">
            <mat-icon>{{ item.icon }}</mat-icon>
            @if (!collapsed()) {
              <span>{{ item.label }}</span>
            }
          </a>
        }
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item logout-btn" (click)="auth.logout()"
                [matTooltip]="collapsed() ? 'Cerrar sesión' : ''" matTooltipPosition="right">
          <mat-icon>logout</mat-icon>
          @if (!collapsed()) { <span>Cerrar sesión</span> }
        </button>
      </div>
    </aside>

<header class="header">
  <button mat-icon-button class="toggle-btn" (click)="toggleSidebar.emit()" matTooltip="Menú">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="header-title">{{ title() }}</div>

  <div class="header-spacer"></div>

  <!-- Theme toggle -->
  <button mat-icon-button class="theme-btn"
          (click)="theme.toggle()"
          [matTooltip]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <!-- User menu -->
  <div class="header-user" [matMenuTriggerFor]="userMenu">
    <div class="user-avatar">{{ userInitial }}</div>
    <div class="user-info">
      <span class="user-name">{{ auth.currentUser()?.name }}</span>
      <span class="user-role">{{ auth.currentUser()?.role ? roleLabel(auth.currentUser()!.role) : '' }}</span>
    </div>
    <mat-icon class="chevron">keyboard_arrow_down</mat-icon>
  </div>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item [routerLink]="['/auth/change-password']">
      <mat-icon>lock</mat-icon> Cambiar contraseña
    </button>
    <button mat-menu-item (click)="auth.logout()">
      <mat-icon>logout</mat-icon> Cerrar sesión
    </button>
  </mat-menu>
</header>
